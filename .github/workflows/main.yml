name: 🚀 Validate and build artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      ['v*']
  pull_request:
    branches:
      - main

# These permissions are needed for GitHub Pages and repository access
permissions:
  contents: read
  pages: write      # Needed to deploy to Pages
  id-token: write   # Needed for auth with Pages

jobs:
  web-flow:
    name: Website Build, Validate, and Publish
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && '' || 'github-pages' }}
      url: ${{ github.event_name == 'pull_request' && '' || steps.deployment.outputs.page_url }}    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Minifier Tools
        run: npm install terser html-minifier csso-cli
      - name: Install Validation Tools
        run: npm install htmlhint eslint stylelint stylelint-config-standard
      - name: ✅ Validating HTML
        run: |
          npx htmlhint release_notes.html
      - name: ✅ Validating JavaScript
        run: |
          npx eslint release_notes.js
      - name: ✅ Validating CSS
        run: |
          npx stylelint release_notes.css
      - name: 📝 Minifying HTML
        run: |
          npx html-minifier --collapse-whitespace --remove-comments --minify-css true --minify-js true -o release_notes.html release_notes.html
      - name: 📝 Minifying JavaScript
        run: |
          npx terser release_notes.js -o release_notes.js --compress --mangle --comments "/eslint/"
      - name: 📝 Minifying CSS
        run: |
          npx csso-cli release_notes.css --output release_notes.css
      - name: ✅ Validate minified HTML
        run: |
          npx htmlhint release_notes.html
      - name: ✅ Validate minified JavaScript
        run: |
          npx eslint release_notes.js
      - name: ✅ Validate minified CSS
        run: |
          npx stylelint release_notes.css
      - name: 📦 Prepare deployment files
        run: |
          mkdir -p deploy
          cp release_notes.html deploy/
          cp release_notes.js deploy/
          cp release_notes.css deploy/
          cp release_notes.py deploy/
      - name: 📤 Upload deploy artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deploy-files
          path: deploy/
          retention-days: 1

      - name: Export release notes from current repository
        run: |
          # Create a directory for the Pages content
          mkdir -p pages
          python release_notes.py --num_commits 50 --output ./pages/release_notes.json
          cp release_notes.html ./pages/index.html
          cp release_notes.js ./pages/
          cp release_notes.css ./pages/ 
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6        
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: web-flow
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7
        with:
          # Required to fetch all tags for release detection
          fetch-depth: 0

      - name: 📥 Download deploy artifacts
        uses: actions/download-artifact@v8
        with:
          name: deploy-files
          path: deploy/
      
      - name: 📦 Create zip archive
        run: |
          cd deploy
          zip release_notes.zip release_notes.html release_notes.js release_notes.css release_notes.py

      - name: 🏷️ Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            deploy/release_notes.html \
            deploy/release_notes.js \
            deploy/release_notes.css \
            deploy/release_notes.py \
            deploy/release_notes.zip \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes
