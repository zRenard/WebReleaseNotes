<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-document-title">Release Notes</title>
    <link rel="stylesheet" href="release_notes.css?v=14">
</head>
<body>
    <div class="container">
        <div class="header-info">
            <div>
                <h1 id="page-title">Release Notes</h1>
                <div class="metadata" id="metadata">
                    <div class="loading">Loading release notes...</div>
                </div>
            </div>
            <div class="header-actions">
<button class="theme-toggle" id="theme-toggle" title="Toggle dark theme">
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
            </div>
        </div>

        <div class="view-controls hidden" id="view-controls">
            <div class="mode-buttons">
                <button class="mode-btn active" id="btn-by-commit" data-mode="commit" title="View commits individually">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg>
                    By Commit
                </button>
                <button class="mode-btn" id="btn-by-release" data-mode="release" title="View commits aggregated by release tags">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
                    By Release
                    <span class="release-badge incoming badge-hidden" id="incoming-badge">0</span>
                    <span class="release-badge real badge-hidden" id="real-release-badge">0</span>
                </button>
            </div>
            <div class="author-filter hidden" id="author-filter">
                <label for="author-dropdown">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Author:
                </label>
                <select id="author-dropdown">
                    <option value="">All Authors</option>
                </select>
            </div>
            <div class="release-selector hidden" id="release-selector">
                <label for="release-dropdown">Select Release:</label>
                <select id="release-dropdown">
                    <option value="">All Releases</option>
                </select>
            </div>
        </div>

        <div class="summary" id="summary"></div>

        <div class="filter-status-bar hidden" id="filter-status-bar"></div>

        <div class="search-container hidden" id="search-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search commits (title, content, author, type, release, date)..." />
                <button id="search-clear" class="search-clear-btn" title="Clear search">✕</button>
            </div>
            <div class="search-info" id="search-info"></div>
        </div>

        <div id="releases-container"></div>

        <div class="footer">
            <a id="download-json" href="release_notes.json" download class="download-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download JSON
            </a>
            <a id="download-markdown" href="RELEASE_NOTES.md" download class="download-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                Download Markdown
            </a>
        </div>
    </div>
    <script src="release_notes.js?v=16"></script>
</body>
</html>
